[package]
name = "deepl"
version = "0.8.2"
edition = "2021"
authors = ["Avimitin <avimitin@gmail.com>"]
description = "A Rust implementation of the DeepL API"
documentation = "https://docs.rs/deepl"
keywords = ["translate", "deepl", "api"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Avimitin/deepl-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2.0.20"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json", "stream", "charset", "http2", "form", "query", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs", "rt-multi-thread", "io-util"] }
tokio-stream = "0.1.19"
paste = "1.0.15"
typed-builder = "0.23.2"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dev-dependencies]
docx-rs = "0.4.22"

[lib]
doctest = false
